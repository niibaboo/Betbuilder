name: Match IQ

on:
schedule:
- cron: '0 6 * * *'
push:
branches: [main]
workflow_dispatch: {}

permissions:
contents: write
pages: write
id-token: write

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Check out repo
uses: actions/checkout@v4

- name: Set up Python
uses: actions/setup-python@v5
with:
python-version: '3.11'

- name: Install dependencies
run: pip install requests

- name: Run Match IQ
env:
THESTATSAPI_KEY: ${{ secrets.THESTATSAPI_KEY }}
run: python3 match_iq.py

- name: Commit and push updated predictions
run: |
git config user.name "github-actions[bot]"
git config user.email "github-actions[bot]@users.noreply.github.com"
git add docs/
git diff --staged --quiet || git commit -m "Update Match IQ predictions"
git push

deploy:
needs: build
runs-on: ubuntu-latest
environment:
name: github-pages
url: ${{ steps.deployment.outputs.page_url }}
steps:
- name: Check out repo
uses: actions/checkout@v4
with:
ref: main
- name: Configure Pages
uses: actions/configure-pages@v4
- name: Upload artifact
uses: actions/upload-pages-artifact@v3
with:
path: docs
- name: Deploy to Pages
uses: actions/deploy-pages@v4
id: deployment
