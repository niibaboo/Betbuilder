name: Match IQ

on:
  schedule:
    # Runs once daily at 06:00 UTC. Adjust the cron below to change timing —
    # cron times are always UTC regardless of your local timezone.
    - cron: '0 6 * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the generated docs/ folder back

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Match IQ
        env:
          THESTATSAPI_KEY: ${{ secrets.THESTATSAPI_KEY }}
        run: python3 match_iq.py

      - name: Commit and push updated predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Update Match IQ predictions"
          git push
